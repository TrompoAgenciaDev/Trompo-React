<!DOCTYPE html>

  <head>
    <!-- Google Tag Manager - Inicialización asíncrona del dataLayer -->
    <script>
      // Inicializar dataLayer de forma no bloqueante
      window.dataLayer = window.dataLayer || [];
    </script>
    <!-- Google Tag Manager - Script diferido después de window.load -->
    <script>
      // Cargar GTM después de window.load para no bloquear render inicial
      function loadGTM() {
        // Excluir página de limpieza de caché de las analíticas
        if (window.location.pathname !== '/clear-cache' && !window.location.pathname.includes('/clear-cache')) {
          (function (w, d, s, l, i) {
            w[l].push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
            var j = d.createElement(s),
              dl = l != "dataLayer" ? "&l=" + l : "";
            j.async = true;
            j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
            d.head.appendChild(j);
          })(window, document, "script", "dataLayer", "GTM-WTCNM4L");
        }
      }
      
      // Cargar después de window.load o después de 3 segundos como máximo
      if (document.readyState === 'complete') {
        loadGTM();
      } else {
        window.addEventListener('load', loadGTM);
        // Fallback: cargar después de 3 segundos máximo
        setTimeout(loadGTM, 3000);
      }
    </script>
    <!-- End Google Tag Manager -->

    <meta charset="UTF-8" />

    <link rel="preconnect" href="https://www.googletagmanager.com" />

    <!-- Preload recursos críticos del hero -->

    <link 
      rel="preload" 
      href="/assets/hero/home.webp" 
      as="image" 
      type="image/webp" 
      media="(min-width: 768px)"
      fetchpriority="high"
    />

    <link 
      rel="preload"

      as="image"

    <!-- CSS crítico inline para header y hero - evita CLS y mejora LCP -->
    <style>
      /* Header crítico */
      header.full-container {
        z-index: 100;
        position: static;
        height: fit-content;
        padding: 0 10px;
      }
      
      .header .container {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      
      .logo-img {
        width: 150px;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      
      @media (min-width: 768px) {
        .header .container {
          padding: 20px 0;
        }
        .logo-img {
          width: 160px;
        }
      }
      
      @media (min-width: 1024px) {
        .logo-img {
          width: 180px;
        }
      }
      
      /* Hero container crítico */
      .hero-video,
      .hero-poster-img {
        width: 100vw;
        height: 100vh;
        min-height: 100vh;
        display: block;
        object-fit: cover;
      }
      
      /* Mobile hero */
      @media (max-width: 767px) {
        .hero-video,
        .hero-poster-img {
          aspect-ratio: 768 / 1024;
          height: auto;
          min-height: 100vh;
        }
      }
      
      /* Desktop hero */
      @media (min-width: 768px) {
        .hero-video,
        .hero-poster-img {
          aspect-ratio: 1920 / 1080;
          height: auto;
          min-height: 100vh;
        }
      }
      
      /* Contenedor hero */
      [data-hero-container] {
        position: relative;
        width: 100vw;
        height: 100vh;
        min-height: 100vh;
        overflow: hidden;
      }
      
      @media (max-width: 767px) {
        [data-hero-container] {
          aspect-ratio: 768 / 1024;
          height: auto;
        }
      }
      
      @media (min-width: 768px) {
        [data-hero-container] {
          aspect-ratio: 1920 / 1080;
          height: auto;
        }
      }
    </style>

    <!-- Brevo (Sibforms) - Cargar después de window.load -->
    <script>
      function loadBrevo() {
        // Verificar que el body existe antes de agregar el script
        if (!document.body) {
          setTimeout(loadBrevo, 100);
          return;
        }
        
        // Verificar que no existe ya el script
        if (document.querySelector('script[src*="sibforms.com"]')) {
          return;
        }
        
        var script = document.createElement('script');
        script.defer = true;
        script.src = 'https://sibforms.com/forms/end-form/build/main.js';
        script.onerror = function() {
          console.warn('Error al cargar script de Brevo');
        };
        document.body.appendChild(script);
      }
      
      if (document.readyState === 'complete') {
        loadBrevo();
      } else {
        window.addEventListener('load', loadBrevo);
        // Fallback: cargar después de 3 segundos máximo
        setTimeout(loadBrevo, 3000);
      }
    </script>
