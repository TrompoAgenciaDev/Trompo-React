    <!-- Google Tag Manager - Script diferido después de window.load -->
    <script>
      // Cargar GTM después de window.load para no bloquear render inicial
      function loadGTM() {
        // Excluir página de limpieza de caché de las analíticas
        if (window.location.pathname !== '/clear-cache' && !window.location.pathname.includes('/clear-cache')) {
          (function (w, d, s, l, i) {
            w[l].push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
            var j = d.createElement(s),
              dl = l != "dataLayer" ? "&l=" + l : "";
            j.async = true;
            j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
            d.head.appendChild(j);
          })(window, document, "script", "dataLayer", "GTM-WTCNM4L");
        }
      }
      
      // Cargar después de window.load o después de 3 segundos como máximo
      if (document.readyState === 'complete') {
        loadGTM();
      } else {
        window.addEventListener('load', loadGTM);
        // Fallback: cargar después de 3 segundos máximo
        setTimeout(loadGTM, 3000);
      }
    </script>

    <!-- Brevo (Sibforms) - Lazy load condicional: solo cuando el formulario esté cerca del viewport -->
    <script>
      function loadBrevo() {
        // Verificar que no existe ya el script
        if (document.querySelector('script[src*="sibforms.com"]')) {
          return;
        }
        
        var script = document.createElement('script');
        script.defer = true;
        script.src = 'https://sibforms.com/forms/end-form/build/main.js';
        script.onerror = function() {
          console.warn('Error al cargar script de Brevo');
        };
        document.body.appendChild(script);
      }
      
      // Cargar solo cuando el formulario esté cerca del viewport (Intersection Observer)
      function initBrevoLazyLoad() {
        function checkAndLoad() {
          const brevoForm = document.querySelector('.sib-form, #sib-form, [data-sib-form]');
          if (!brevoForm) {
            return;
          }
          
          // Si Intersection Observer está disponible, usarlo para lazy load
          if ('IntersectionObserver' in window) {
            const observer = new IntersectionObserver(function(entries) {
              entries.forEach(function(entry) {
                if (entry.isIntersecting) {
                  loadBrevo();
                  observer.disconnect();
                }
              });
            }, {
              // Cargar cuando el formulario esté a 200px del viewport
              rootMargin: '200px'
            });
            
            observer.observe(brevoForm);
            
            // Fallback: cargar después de 5 segundos si el formulario no entra en viewport
            setTimeout(function() {
              if (document.querySelector('script[src*="sibforms.com"]')) {
                return; // Ya se cargó
              }
              loadBrevo();
              observer.disconnect();
            }, 5000);
          } else {
            // Fallback para navegadores sin Intersection Observer
            // Cargar después de que la página esté completamente cargada
            if (document.readyState === 'complete') {
              setTimeout(loadBrevo, 2000);
            } else {
              window.addEventListener('load', function() {
                setTimeout(loadBrevo, 2000);
              });
            }
          }
        }
        
        // Esperar a que React renderice los componentes
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function() {
            setTimeout(checkAndLoad, 500);
          });
        } else {
          setTimeout(checkAndLoad, 500);
        }
      }
      
      initBrevoLazyLoad();
    </script>
